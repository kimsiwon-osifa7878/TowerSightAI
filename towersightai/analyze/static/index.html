<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TowerSightAI 데이터 분석</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-title">TowerSightAI</div>
      <div class="brand-sub">데이터 분석 · 개발/검증 전용</div>
    </div>
    <nav id="nav">
      <a href="#/overview" data-route="overview">개요</a>
      <a href="#/day" data-route="day">타임라인</a>
      <a href="#/episodes" data-route="episodes">에피소드</a>
      <a href="#/compare" data-route="compare">비교</a>
      <a href="#/tuning" data-route="tuning">임계값 스윕</a>
      <a href="#/dictionary" data-route="dictionary">데이터 사전</a>
      <a href="#/data" data-route="data">데이터 · NAS 설정</a>
    </nav>
    <div class="side-section">
      <div class="side-label">현장 (NAS)</div>
      <select id="site-select"></select>
      <div class="side-actions">
        <button class="small primary" id="btn-nas-update" title="새 날짜·바뀐 날짜의 이벤트 파일만 NAS에서 받아 반영합니다 (스냅샷·클립 제외)">NAS 최신화</button>
        <span class="hint" id="nas-update-status">—</span>
      </div>
      <div class="side-label">호스트</div>
      <select id="host-select"><option value="">전체</option></select>
      <div class="side-label">기간</div>
      <div class="range-row">
        <input type="date" id="range-from"> <span>~</span> <input type="date" id="range-to">
      </div>
      <div class="side-actions">
        <button class="small" id="btn-range-week">최근 7일</button>
        <button class="small" id="btn-range-all">전체</button>
      </div>
    </div>
    <details class="side-section" id="params-drawer">
      <summary>에피소드 재현 파라미터 <span class="hint">(엔진 규칙)</span></summary>
      <div class="param-grid">
        <label title="detection_batch 신뢰도 하한. 엔진은 자식 0.2 이상을 모두 사용">카메라 신뢰도 ≥ <input type="number" step="0.05" min="0" max="1" data-param="min_confidence"></label>
        <label title="stale 초 안에 연속으로 잡혀야 하는 프레임 수 (person_debounce.idle_frames)">연속 프레임 <input type="number" step="1" min="1" data-param="consecutive_frames"></label>
        <label title="마지막 감지 후 이 시간이 지나면 종료 (person_debounce.stale_seconds)">stale 초 <input type="number" step="0.5" min="0.5" data-param="stale_seconds"></label>
        <label title="카메라 간/에피소드 간 이 간격 이내면 하나로 병합">병합 간격 초 <input type="number" step="1" min="0" data-param="merge_gap_seconds"></label>
        <label title="비우면 전체. 엔진 IDLE 감시는 opposite_side 제외">카메라 <input type="text" placeholder="front,rear_side" data-param="cameras"></label>
        <label title="레이더 감지가 이 시간 이상 이어져야 창 확정">레이더 확정 초 <input type="number" step="0.5" min="0.5" data-param="radar_confirm_seconds"></label>
        <label title="레이더 없음/알 수 없음이 이 시간 이상이면 종료">레이더 해제 초 <input type="number" step="0.5" min="0.5" data-param="radar_clear_seconds"></label>
        <label title="target_status 1/3(이동)만 감지로 인정">이동만 <input type="checkbox" data-param="radar_moving_only"></label>
        <label title="0이면 게이트 없음">거리 ≤ cm <input type="number" step="10" min="0" data-param="radar_max_distance_cm"></label>
        <label title="0이면 게이트 없음">에너지 ≥ <input type="number" step="5" min="0" data-param="radar_min_energy"></label>
        <label title="카메라·레이더 에피소드를 같은 사건으로 묶는 허용 오차">정합 허용 초 <input type="number" step="0.5" min="0" data-param="pair_tolerance_seconds"></label>
      </div>
      <div class="side-actions">
        <button class="small primary" id="btn-params-apply">적용</button>
        <button class="small" id="btn-params-reset">기본값</button>
      </div>
    </details>
    <div class="side-section">
      <div class="side-label">검토자 이름</div>
      <input type="text" id="reviewer-name" placeholder="예: kimsiwon">
    </div>
    <div class="side-foot">읽기 전용 분석 · 안전 게이트/PLC와 무관</div>
  </aside>
  <main id="main"><div class="empty">불러오는 중…</div></main>
</div>
<div id="toast"></div>
<script src="/static/app.js"></script>
</body>
</html>
