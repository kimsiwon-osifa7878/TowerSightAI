[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "towersightai"
version = "0.1.0"
description = "Safety-first parking machine AI monitoring core"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
towersightai-check-settings = "towersightai.cli.check_settings:main"
