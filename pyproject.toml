[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "towersightai"
version = "0.1.0"
description = "Safety-first parking machine AI monitoring core"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
]

[project.optional-dependencies]
ui = [
  "fast-alpr[onnx]>=0.4.0",
  "opencv-python>=4.8",
  "PyQt6>=6.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["towersightai*"]
exclude = ["refers*"]

[project.scripts]
towersightai-check-settings = "towersightai.cli.check_settings:main"
towersightai-ai-diagnostics = "towersightai.cli.ai_diagnostics:main"
towersightai-operator-ui = "towersightai.cli.operator_ui:main"
towersightai-hailo-image-smoke = "towersightai.cli.hailo_image_smoke:main"
